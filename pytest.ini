# Testing Configuration
[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=src/distributed_training
    --cov-report=html
    --cov-report=term-missing
markers =
    unit: Unit tests for individual components
    integration: Integration tests for end-to-end workflows
    regression: Regression tests to prevent breaking changes
    performance: Performance and benchmarking tests
    distributed: Distributed training tests (requires multiple GPUs)
    slow: Slow tests (execution time > 1 minute)

[coverage:run]
source = src/distributed_training
omit =
    */tests/*
    */test_*.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
